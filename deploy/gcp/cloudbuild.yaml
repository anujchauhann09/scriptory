# ===========================================================================
# Build and deploy pipeline: build -> push -> migrate -> deploy.
#
# The ordering constraint is that the schema is in place before any revision
# serves traffic, so a container never meets a database it does not expect.
#
# The migration runs as a **Cloud Run Job**, not as a Cloud Build step. That is
# forced by the architecture rather than a preference:
#
#   Cloud SQL has a private IP only. Cloud Build's default pool runs outside the
#   VPC and has no route to an RFC1918 address, so no build step can reach the
#   database — with or without the Cloud SQL Auth Proxy, which cannot conjure a
#   network path that does not exist. The alternatives are a private Cloud Build
#   pool (a paid worker pool) or giving the instance a public IP (undoing the
#   private-only decision). A Cloud Run Job needs neither: it runs the image we
#   just built, attached to the VPC via Direct VPC egress, which is free.
#
# Cloud Build's role is therefore to orchestrate, never to touch the database.
# It no longer needs the database credential at all.
# ===========================================================================
substitutions:
  _REGION: asia-south1
  _REPO: scriptory
  _SERVICE: scriptory-api
  _MIGRATE_JOB: scriptory-migrate
  # Direct VPC egress needs a network and a subnet in the same region as the
  # service. These are the auto-mode default VPC's names.
  _NETWORK: default
  _SUBNET: default
  # Least-privilege runtime identities. Neither is the Cloud Build service
  # account, and neither can do the other's job.
  _API_SA: scriptory-api
  _MIGRATE_SA: scriptory-migrate

steps:
  # 1. Build.
  #
  #    Tagged with $BUILD_ID, used directly rather than through a user-defined
  #    substitution. Two things bite here:
  #
  #      - $COMMIT_SHA is populated only for trigger-based builds backed by a
  #        source repository. A manual `gcloud builds submit` leaves it empty,
  #        producing the image name "…/api:", rejected before any step runs.
  #      - Cloud Build does not expand built-in substitutions inside the
  #        *defaults* of user-defined ones, so `_TAG: $BUILD_ID` passes the
  #        literal string "$BUILD_ID" through as the tag. Built-ins only expand
  #        where they are used directly, which is why $PROJECT_ID works here.
  #
  #    $BUILD_ID is set in both build modes, and traceability is unaffected:
  #    `gcloud builds describe <BUILD_ID>` reports the exact source the image was
  #    built from.
  #
  #    `latest` is a convenience pointer; nothing in the pipeline deploys from it.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$BUILD_ID
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:latest
      - --file=backend/Dockerfile
      - backend

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api"]

  # 2. Migrate, as a Cloud Run Job on the VPC.
  #
  #    Same image as the service, so the migrations that run are exactly the ones
  #    the new revision was built against — there is no separate migration image
  #    to drift out of sync.
  #
  #    `--command`/`--args` replace the image's entrypoint for this execution
  #    only. `prisma migrate deploy` applies committed migrations and nothing
  #    else: it never generates, never resets, and skips anything already
  #    applied, which is what makes it safe to run unattended and safe to retry.
  #
  #    This is also why migrations do not run at container startup: every
  #    instance in a scale-out would race to apply them, and a bad migration
  #    would crash-loop the service instead of failing one pipeline step.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATE_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$BUILD_ID
      - --region=${_REGION}
      # Direct VPC egress: the job gets an address on the subnet and can reach
      # the Cloud SQL private IP. No connector, no NAT, no worker pool.
      - --network=${_NETWORK}
      - --subnet=${_SUBNET}
      # Only RFC1918 traffic goes through the VPC. Sending everything would
      # require a Cloud NAT for the job's public egress — a paid resource this
      # deployment has no other use for.
      - --vpc-egress=private-ranges-only
      # The job reads the credential itself, so it never passes through Cloud
      # Build and never appears in a build log.
      - --set-secrets=DATABASE_URL=scriptory-database-url:latest
      - --service-account=${_MIGRATE_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --command=npx
      - --args=prisma,migrate,deploy
      # One retry absorbs a transient VPC or connection blip. A migration that
      # genuinely fails is recorded as failed by Prisma and the retry stops on
      # it, so this cannot paper over a broken migration.
      - --max-retries=1
      - --task-timeout=10m
      # Memory beyond the default because `prisma migrate deploy` loads the
      # engine; CPU is irrelevant for a schema change.
      - --memory=512Mi
      # Run it now and block. Without --wait the pipeline would deploy the new
      # revision while the migration was still in flight.
      - --execute-now
      - --wait

  # 3. Shift traffic, only once the schema is in place.
  #
  #    service.yaml is the canonical Cloud Run runtime definition: scaling,
  #    networking, env vars, secret references, probes, service account and
  #    traffic policy live there. The pipeline renders only the image field to
  #    the just-built immutable tag, then applies the full service definition.
  #
  #    This matters because `gcloud run deploy --image=...` does not read
  #    service.yaml. It creates a new revision from the currently deployed
  #    service config, preserving stale env vars and omitting any new env vars
  #    that only exist in the manifest.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        : "${_SERVICE}" "${_API_SA}"
        SERVICE_CONFIG=/tmp/scriptory-service.yaml
        cp deploy/gcp/service.yaml "$$SERVICE_CONFIG"
        sed -i "s|^          - image: .*|          - image: ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$BUILD_ID|" "$$SERVICE_CONFIG"
        gcloud run services replace "$$SERVICE_CONFIG" --region=${_REGION}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:latest

options:
  logging: CLOUD_LOGGING_ONLY
  # No machineType override. The default pool is ample: this build is an
  # `npm ci`, a `prisma generate` and a layer export — I/O and network bound,
  # not CPU bound. E2_HIGHCPU_8 was billing eight vCPUs to wait on the network.
  # If build time ever becomes the bottleneck, measure first, then raise it.

# Generous enough for a cold build plus a migration, tight enough that a hung
# step fails instead of billing until the default limit.
timeout: 1800s
