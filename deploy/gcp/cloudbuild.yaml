# ===========================================================================
# Build and deploy pipeline.
#
# Cloud Build here, but every step is a container invocation — the same sequence
# works in GitHub Actions, GitLab CI or any other runner. Only this file is
# GCP-specific.
#
# Order matters: migrations run before traffic shifts, so a revision never
# serves against a schema it does not expect.
# ===========================================================================
substitutions:
  _REGION: us-central1
  _REPO: scriptory
  _SERVICE: scriptory-api
  _INSTANCE: scriptory-db

steps:
  # 1. Build. The image is tagged with the commit SHA, so every deployment is
  #    traceable to an exact source revision and a rollback is unambiguous.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$COMMIT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:latest
      - --file=backend/Dockerfile
      - backend

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api"]

  # 2. Migrate before deploying.
  #
  #    `prisma migrate deploy` only applies committed migrations and never
  #    generates or resets anything, which is what makes it safe to run
  #    unattended. It runs here rather than at container startup on purpose: at
  #    startup, every instance in a scale-out event would race to migrate the
  #    same database, and a failed migration would crash-loop the service
  #    instead of failing one build step.
  - id: migrate
    name: ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$COMMIT_SHA
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        ./cloud-sql-proxy --unix-socket /cloudsql $$INSTANCE_CONNECTION_NAME &
        sleep 5
        npx prisma migrate deploy
    env:
      - "INSTANCE_CONNECTION_NAME=$PROJECT_ID:${_REGION}:${_INSTANCE}"
    secretEnv: ["DATABASE_URL"]

  # 3. Shift traffic only once the schema is in place.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      # No --allow-unauthenticated here: keep the IAM policy managed
      # deliberately rather than reasserted on every build.

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/scriptory-database-url/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
